<!DOCTYPE html>
<html>
<head>
<title>Dom32IO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    margin:0;
    padding:0;
    background:#e0e0e0;
    font-family:sans-serif;
    font-size:18px;
}
.container{
    padding:10px;
    background:#fff;
    margin:10px;
    border-radius:10px;
    box-shadow:0 0 5px #999;
}
h1{
    margin:0 0 10px 0;
    font-size:22px;
    text-align:center;
}
label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}
input{
    width:100%;
    height:45px;
    font-size:18px;
    padding:5px;
    margin-top:5px;
    box-sizing:border-box;
    border-radius:6px;
    border:1px solid #888;
}
button{
    width:100%;
    height:55px;
    font-size:20px;
    margin-top:20px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>
<div class="container">
<form method="post">

<h1>WiFi Config</h1>

<label>MAC</label>
<div style="font-size:18px; padding:8px 0;">c8c9a34a61ac</div>

<label>AP1 SSID</label>
<input type="text" name="ap1" value="872e">

<label>AP1 Password</label>
<input type="text" name="ap1p" value="AeD*aYZfdVDyyE]pet+A">

<label>AP2 SSID</label>
<input type="text" name="ap2" value="">

<label>AP2 Password</label>
<input type="text" name="ap2p" value="">

<label>Central 1</label>
<input type="text" name="ce1" value="192.168.10.24:8080">

<label>Central 2</label>
<input type="text" name="ce2" value="192.168.10.40:80">

<label>Path</label>
<input type="text" name="path" value="/cgi-bin">

<button type="submit">Guardar</button>

</form>
</div>
</body>
</html>
